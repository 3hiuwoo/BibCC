# Example missing_venues.yaml file
# When entries use venues that aren't in the venue library, `bibcc complete refs.bib`
# writes this file to .bibcc/refs.bib/missing_venues.yaml. `bibcc add` and
# `bibcc upgrade` write one for the entries they create, and `--learn` of
# `bibcc check official` and `bibcc check editions` writes one for the venue
# schemas whose journal or edition record the library lacks.
# To merge it, fill in the fields, and then run the following command (for the
# project library, add --scope project):
#   bibcc complete refs.bib --output out.bib --update-venues
#
# The schema is the same as the venue library's (for example, examples/venues/miaa.yaml):
#   journals:    year-agnostic, matched by name, alias, or ISSN
#   proceedings: matched by name or alias together with the entry's publication
#                year, or by an interim booktitle (CVF Open Access, OpenReview)
# A family record of the library (families:) gives its fields to every edition;
# the file shows them commented out, and the record leaves them out.
#
# The comment after a value says where the value comes from:
# '# from bib'             value found in your entries; the keys in parentheses say which
# '# from official BibTeX' value from the official BibTeX that `bibcc add`, `bibcc upgrade`, or
#                          `bibcc check official` downloaded
# '# from YEAR edition'    value copied from the previous edition in the library (when the venue has no family record)
# '# from family NAME'     value that the family record gives every edition; leave it commented out
# '# from CrossRef'        value that CrossRef reports (`bibcc complete --online`, `bibcc add`)
# '# auto-guessed'         value inferred from the venue name; verify it
# A record's '# entries:' comment names the entries that cite the venue.
# A record's entry_fields, from --learn of `bibcc check official` or `bibcc check editions`,
# is the venue's schema; merging writes it into the library record too.
# When merging, BibCC skips records that have no field (and no interim booktitle) filled in.
# BibCC merges this file on every run, so it keeps what you fill in.
# To check only these records for missing fields before merging (instead of checking the
# whole library afterwards), run:
#   bibcc check venues --venues .bibcc/refs.bib/missing_venues.yaml

journals:
  - name: "IEEE Transactions on Example Journal"
    # entries: Doe_Example2026
    # aliases: []  # other spellings of this venue
    fields:
      publisher: "IEEE"  # auto-guessed
      issn: "1234-5678"  # from CrossRef
      # address: ""  # optional; for example, New York, NY, USA
      # month: ""  # optional; none for a journal without monthly issues

  # Written by `bibcc check official refs.bib --learn` for a journal without a record.
  - name: "Journal of Examples"
    # entries: Doe_JE2026, Li_JE2026
    # aliases: []  # other spellings of this venue
    fields:
      publisher: "Elsevier"  # from official BibTeX (Doe_JE2026, Li_JE2026)
      issn: "0000-0000"  # from official BibTeX (Doe_JE2026, Li_JE2026)
      # address: ""  # optional; for example, New York, NY, USA
      # month: ""  # optional; none for a journal without monthly issues
    entry_fields: [doi, pages, volume]  # the venue's schema; merging adds it too
    learned_from: "official BibTeX of 2 entries (2026), 2026-03-01"

proceedings:
  - name: "2026 Example Conference on Something (EXC)"
    year: "2026"  # publication year, not necessarily the edition in the name
    aliases: ["Proceedings of the Example Conference (EXC)"]
    fields:
      venue: ""  # for example, City, Country
      publisher: "IEEE"  # from 2025 edition
      month: ""  # the event month, such as June, if the whole event falls in it; none if it runs across two months
      # isbn: ""
      # issn: ""
      # editor: ""
      # series: ""
      # address: ""

  - name: "Proceedings of the 43rd International Conference on Machine Learning"
    # entries: Doe_ICML2026
    year: "2026"
    fields:
      venue: ""  # for example, City, Country
      # publisher: "PMLR"  # from family International Conference on Machine Learning (ICML); every edition gets it
      month: ""  # the event month, such as June, if the whole event falls in it; none if it runs across two months
      # isbn: ""
      # issn: ""
      # editor: ""
      # series: "Proceedings of Machine Learning Research"  # from family International Conference on Machine Learning (ICML); every edition gets it
      # address: ""

  # Proposed by `bibcc add` for a paper whose proceedings are now in IEEE Xplore.
  - name: "2026 IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR)"
    # Merging renames the library record 'Proceedings of the IEEE/CVF Conference on ...' (cvf booktitle) to this name.
    year: "2026"
    interim:  # booktitles CVF Open Access or OpenReview use for these proceedings
      cvf: "Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR)"
    fields:
      venue: ""  # for example, City, Country
      publisher: "IEEE"  # from 2025 edition
      month: "June"  # from bib (Key_A_CVPR2026)
      isbn: ""
      issn: "2575-7075"  # from 2025 edition

# ---- Suggested corrections to library records (bibcc complete --online)
# CrossRef disagrees with these library values. To apply one, move the record
# into its section earlier in this file (journals: or proceedings:) and remove the '# '.
#
#  - name: "2025 IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR)"
#    year: "2025"
#    fields:
#      venue: "Nashville, TN, USA"  # library has "Seattle, WA, USA"; CrossRef for Key_A_CVPR2025 (10.1109/...)
#

# Reference for common fields:
#
# For journals:
#   - publisher: Publisher name (for example, "IEEE", "Elsevier", or "Springer")
#   - issn: ISSN
#   - address: Publisher location (optional)
#   - month: "none" for a journal without monthly issues (optional). Otherwise leave it out:
#     each entry takes the month of its issue.
#
# For proceedings:
#   - venue: Conference location (for example, "Seattle, WA, USA")
#   - publisher: Publisher name
#   - isbn: ISBN
#   - issn: ISSN (if applicable)
#   - month: Conference month (for example, "June" or "October"), only when the whole event
#     falls in it; "none" when the event runs across two months. For an event held in several
#     places, use the dates of the main venue. A month in the official BibTeX always wins.
#   - editor: Editor names in BibTeX format
#   - series: Conference series name
#   - address: Publisher location
#   - day: Conference days (for example, "21--27")
