name: Release

# Push a tag vX.Y.Z (matching __version__ and a dated CHANGELOG section) to release.
# See CONTRIBUTING.md for the checklist.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - id: check
        name: Tag, version, and changelog agree
        run: python3 .github/scripts/release.py check "$GITHUB_REF_NAME"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv build
      - run: python3 .github/scripts/release.py notes "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "BibCC ${GITHUB_REF_NAME#v}" --notes-file release-notes.md "${flags[@]}"

  # Off until a PyPI trusted publisher is set up and the repository variable
  # PUBLISH_TO_PYPI is "true" (see CONTRIBUTING.md).
  pypi:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bibcc/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
