[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bibcc"
# The version lives in src/bibcc/__init__.py only (see [tool.hatch.version]).
dynamic = ["version"]
description = "BibTeX Check and Complete: quality checks, field completion, and PDF library alignment"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xiaoyu Sun" }]
keywords = ["bibtex", "bibliography", "latex", "citations", "references"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
requires-python = ">=3.10"
dependencies = [
    # The code uses the bibtexparser 1.x API (bparser.BibTexParser); 2.x is incompatible.
    "bibtexparser>=1.4,<2",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/3hiuwoo/BibCC"
Documentation = "https://github.com/3hiuwoo/BibCC#readme"
Issues = "https://github.com/3hiuwoo/BibCC/issues"
Changelog = "https://github.com/3hiuwoo/BibCC/blob/main/CHANGELOG.md"

[project.scripts]
bibcc = "bibcc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.10",
]

[tool.hatch.version]
path = "src/bibcc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bibcc"]

# Venue libraries are user data, so none is packaged; examples/ ships in the sdist only.
# src/bibcc/data/families.yaml (the provider table) is package data, not a venue library.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/missing_venues.example.yaml",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# zip(strict=...) adds noise where lengths are checked just before.
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["bibcc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
